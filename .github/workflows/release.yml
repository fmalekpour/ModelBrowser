name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag must match package.json version'
          }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - run: npm run release:source
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: ModelBrowser-release
          if-no-files-found: error
          path: |
            dist/ModelBrowser-Setup-*-x64.exe
            dist/ModelBrowser-*-source.zip
            dist/SHA256SUMS.txt
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "docs/releases/$tag.md"
          if (!(Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag --verify-tag --draft --title "ModelBrowser $tag" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; inspect an existing draft before retrying.' }
          gh release upload $tag "dist/ModelBrowser-Setup-$version-x64.exe" "dist/ModelBrowser-$version-source.zip" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; upload the workflow artifacts to the existing draft.' }
